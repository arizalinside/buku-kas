<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Buku Hutang — Catatan Hutang Toko</title>
  <meta name="description" content="Catat belanja toko dan hutang ke uang pribadi. Lihat sisa hutang kapan saja." />
  <meta name="theme-color" content="#f6f5f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M9 22V10h3v5.2l5.4-5.2h3.8l-5.9 5.6L21.6 22h-4.1l-4.4-5.6-1.1 1V22z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css?v=6" />
  <style>
    /* Cadangan bila css/styles.css gagal termuat: tombol tambah tetap
       punya tanda fokus, hover, tekan, dan keadaan nonaktif. */
    #fab-add:hover { filter: brightness(1.06); }
    #fab-add:active { transform: scale(0.97); }
    #fab-add:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    #fab-add[disabled],
    #fab-add:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div id="auth-root" class="hidden"></div>

  <div id="app-root" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-name">Buku Hutang</span>
      </div>
      <nav class="nav" id="nav" aria-label="Navigasi utama"></nav>
      <div class="sidebar-foot">
        <div id="sync-status" class="sync-line"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-title">Buku Hutang</span>
        </div>
        <div class="clock" id="clock">
          <div class="clock-date" id="clock-date">—</div>
          <div class="clock-time" id="clock-time">— WIB</div>
        </div>
      </header>

      <main class="view container" id="view"></main>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Navigasi bawah"></nav>

    <button class="fab" id="fab-add" type="button" aria-label="Tambah catatan">
      <span id="fab-icon"></span>
    </button>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif">Buku Hutang butuh JavaScript aktif untuk berjalan.</p>
  </noscript>

  <script src="js/config.js?v=6"></script>
  <script src="js/vendor/supabase.js?v=6"></script>
  <script src="js/vendor/gsap.min.js?v=6"></script>
  <script src="js/store.js?v=6"></script>
  <script src="js/ui.js?v=6"></script>
  <script src="js/motion.js?v=6"></script>
  <script src="js/cloud.js?v=6"></script>
  <script src="js/views.auth.js?v=6"></script>
  <script src="js/views.dashboard.js?v=6"></script>
  <script src="js/views.transactions.js?v=6"></script>
  <script src="js/views.reports.js?v=6"></script>
  <script src="js/views.settings.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
